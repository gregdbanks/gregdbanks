name: snake

on:
  schedule:
    - cron: "13 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=light&color_snake=#5A8C7C&color_dots=#3F3A30,#5A8C7C,#D88A7A,#E6A35B,#C8B987
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#D88A7A&color_dots=#2D2A24,#5A8C7C,#E6A35B,#D88A7A,#C8B987

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
