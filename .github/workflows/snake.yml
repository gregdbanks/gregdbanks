name: snake

on:
  schedule:
    - cron: "13 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=light&color_snake=#5A6BFF&color_dots=#1f1f3a,#5A6BFF,#FF3E7E,#FFD23F,#6EE7B7
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF3E7E&color_dots=#0F0F1B,#5A6BFF,#FFD23F,#FF3E7E,#6EE7B7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
